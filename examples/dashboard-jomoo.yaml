title: 九牧马桶
views:
- title: 马桶控制
  path: status
  icon: mdi:toilet
  cards:
  - type: markdown
    content: '## 九牧 ZS800I 控制

      灯与风温0/1/2档已通过设备回读验证；其他功能基于237371协议，待逐项实物核对。默认持续保持蓝牙连接并启动预热；厂商小程序直连前按“释放蓝牙连接”，下次HA操作才重新连接。

      盖圈操作存在联动，关盖还可能触发已开启的关盖冲厕。显示值是最近回读快照；操作结束后查看控制结果。'
  - type: button
    entity: button.jomoo_zs800i_refresh_status
    name: 刷新状态
    show_state: false
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.jomoo_zs800i_refresh_status
  - type: button
    entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_release_bluetooth_connection
    name: 释放蓝牙连接
    show_state: false
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_release_bluetooth_connection
    icon: mdi:bluetooth-off
  - type: markdown
    content: '蓝牙：{{ ''已连接'' if state_attr(''sensor.jiu_mu_zhi_neng_ma_tong_zs800i_last_control_result'',
      ''bluetooth_connected'') else ''未连接 / 正在预热'' }}


      最近命令发出：{{ state_attr(''sensor.jiu_mu_zhi_neng_ma_tong_zs800i_last_control_result'',
      ''last_control_write_ms'') }} ms；前台返回：{{ state_attr(''sensor.jiu_mu_zhi_neng_ma_tong_zs800i_last_control_result'',
      ''last_control_total_ms'') }} ms。'
  - type: entities
    title: 查询与控制结果
    show_header_toggle: false
    entities:
    - entity: sensor.jomoo_zs800i_last_query_result
      name: 最后查询结果
    - entity: sensor.jiu_mu_zhi_neng_ma_tong_zs800i_last_control_result
      name: 最后控制结果
    - entity: sensor.jomoo_zs800i_last_status_time
      name: 最后状态时间
  - type: grid
    columns: 3
    square: false
    cards:
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_stop
      name: 停止清洗/烘干
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_stop
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_large_flush
      name: 大冲
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_large_flush
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_small_flush
      name: 小冲
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_small_flush
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_preserve_ring_state
      name: 打开盖板（保留圈状态）
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_preserve_ring_state
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_close_lid_and_ring
      name: 关盖关圈
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_close_lid_and_ring
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_and_ring
      name: 开盖开圈
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_and_ring
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_close_ring
      name: 开盖关圈
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_open_lid_close_ring
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_hip_wash
      name: 臀洗
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_hip_wash
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_feminine_wash
      name: 妇洗
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_feminine_wash
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_hip_wash
      name: 自动臀洗
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_hip_wash
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_feminine_wash
      name: 自动妇洗
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_feminine_wash
    - type: button
      entity: button.jiu_mu_zhi_neng_ma_tong_zs800i_warm_air_drying
      name: 暖风烘干
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.jiu_mu_zhi_neng_ma_tong_zs800i_warm_air_drying
  - type: entities
    title: 温度档位（不是摄氏度）
    show_header_toggle: false
    entities:
    - entity: number.jiu_mu_zhi_neng_ma_tong_zs800i_water_heating_level_control
      name: 水温档位设置
    - entity: number.jiu_mu_zhi_neng_ma_tong_zs800i_seat_heating_level_control
      name: 座温档位设置
    - entity: number.jiu_mu_zhi_neng_ma_tong_zs800i_air_heating_level_control
      name: 风温档位设置
  - type: entities
    title: 功能开关
    show_header_toggle: false
    entities:
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_atmosphere_light_control
      name: 氛围灯控制
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_foot_sensor
      name: 脚感控制
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_pre_wetting
      name: 预湿润
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_bubble
      name: 自动发泡
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_water_uv_sterilization
      name: 水路UV杀菌
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_close_cover_flushing
      name: 关盖冲厕
    - entity: switch.jiu_mu_zhi_neng_ma_tong_zs800i_automatic_small_flush
      name: 自动小冲
  - type: entities
